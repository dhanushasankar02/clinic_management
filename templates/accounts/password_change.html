{% extends 'base.html' %}

{% block title %}Change Password | Apex Clinic OS{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">

    <!-- Header -->
    <div class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm flex items-center gap-4">
        <div class="w-12 h-12 rounded-2xl bg-teal-50 border border-teal-100 flex items-center justify-center text-teal-600 shrink-0">
            <i data-lucide="key-round" class="w-6 h-6"></i>
        </div>
        <div>
            <h1 class="text-xl font-bold text-slate-900 tracking-tight">Change Your Password</h1>
            <p class="text-xs text-slate-500">Securely update your login password. You will remain logged in.</p>
        </div>
    </div>

    <!-- Password Form -->
    <div class="bg-white p-8 rounded-3xl border border-slate-200/80 shadow-sm space-y-5">
        <form method="POST" action="{% url 'accounts:password_change' %}" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Current Password</label>
                <div class="relative">
                    <input type="password" name="old_password" id="old_pwd" required placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-500/30">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">New Password</label>
                <div class="relative">
                    <input type="password" name="new_password" id="new_pwd" required minlength="6" placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-500/30">
                </div>
                <p class="text-[10px] text-slate-400 mt-1">Must be at least 6 characters long.</p>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Confirm New Password</label>
                <div class="relative">
                    <input type="password" name="confirm_password" id="confirm_pwd" required minlength="6" placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-500/30">
                </div>
            </div>

            <div class="pt-4 flex items-center justify-between border-t border-slate-100">
                <a href="{% url 'accounts:profile' %}" class="text-xs font-semibold text-slate-500 hover:text-slate-800">
                    &larr; Back to Profile
                </a>
                <button type="submit" class="px-6 py-2.5 bg-teal-600 hover:bg-teal-700 text-white rounded-xl text-xs font-bold transition shadow-md shadow-teal-600/20 flex items-center gap-1.5">
                    <i data-lucide="check" class="w-4 h-4"></i> Update Password
                </button>
            </div>
        </form>
    </div>

</div>
{% endblock %}
